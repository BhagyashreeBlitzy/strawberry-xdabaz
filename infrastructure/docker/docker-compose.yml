version: '3.8'

services:
  hello-world-server:
    build:
      context: ../../src/backend
      dockerfile: ../infrastructure/docker/Dockerfile
    image: hello-world-server:${VERSION:-latest}
    container_name: hello-world-server
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
    restart: unless-stopped
    networks:
      - hello-world-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/hello" ,"||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  hello-world-network:
    driver: bridge